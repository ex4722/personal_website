baseURL = "https://eddiexiao.com"
locale = "en-US"
title = "eddie xiao"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

# category slug -> hex, mirrored in data/categories.yaml (used for build-time include)
[params]
  tagline = "vulnerability research · ctf · embedded network stacks"
  handle = "@segfault"
  github = "https://github.com/example"
  matrix = "https://matrix.to/#/@segfault:matrix.org"
  pgp = "/pgp.txt"
  rssDescription = "Vulnerability research, CTF write-ups, and cheatsheets."

[permalinks]
  posts = "/posts/:year/:slug/"
  cheatsheets = "/cheatsheets/:slug/"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.typographer]
        disable = true
  [markup.highlight]
    style = "solarized-dark"
    lineNos = false
    noClasses = false
    codeFences = true
    guessSyntax = true

[outputs]
  home = ["HTML", "RSS", "SEARCHINDEX"]

[outputFormats.RSS]
  mediaType = "application/rss+xml"
  baseName = "feed"

[outputFormats.SEARCHINDEX]
  mediaType = "application/json"
  baseName = "search"
  isPlainText = true
  notAlternative = true

[caches]
  [caches.images]
    dir = ":resourceDir/_gen"

[minify]
  disableXML = true
